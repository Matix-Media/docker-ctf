# Nur fuer Trainer: baut und startet das komplette CTF lokal, ohne Docker Hub.
# For trainers only: builds and runs the whole CTF locally, without Docker Hub.
#
#   docker compose up --build
#   -> http://localhost:8989
#
# ACHTUNG: Compose nimmt den Teilnehmern die Aufgabe ab (Netzwerk, Namen, Volume
# sind hier schon fertig konfiguriert). Nicht an Teilnehmer weitergeben!
services:
  data-provider-svc:
    build: ./data-provider-app
    image: matixmedia/docker-ctf-data-provider:latest
    # Immer lokal bauen. Ohne das holt Compose das (alte) Image aus der Registry
    # und ueberschreibt damit den lokalen Build.
    pull_policy: build
    container_name: data-provider-svc
    networks: [ctf-net]

  ctf-main:
    build: ./main-app
    image: matixmedia/docker-ctf-main:latest
    pull_policy: build
    container_name: ctf-main
    depends_on: [data-provider-svc]
    ports:
      - "8989:8989"
    volumes:
      - ./secrets:/secrets
    networks: [ctf-net]

networks:
  ctf-net:
    name: ctf-net
